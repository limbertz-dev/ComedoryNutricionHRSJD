# Rutas compartidas por HTTP y HTTPS.
root /usr/share/nginx/html;
absolute_redirect off;
client_max_body_size 10m;

# DNS interno de Docker: vuelve a resolver la API si cambia de contenedor.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_backend api:8000;

location = /api {
    return 308 /api/$is_args$args;
}

location ^~ /api/ {
    # /api/auth/login -> /auth/login; conserva los parámetros de consulta.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /api;
}

# SPA: las rutas de React vuelven a index.html; las de API nunca.
location / {
    try_files $uri $uri/ /index.html;
}
location = /index.html {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
