# Se monta con docker-compose.https.yml; requiere certificado y clave.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/comedor_tls_cert;
    ssl_certificate_key /run/secrets/comedor_tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    include /etc/nginx/comedor-rutas.conf;
}
